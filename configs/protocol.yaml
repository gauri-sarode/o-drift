# Experimental protocol. Frozen BEFORE any O-DRIFT tuning (see docs/PLAN.md).
# Any change after the freeze date must be committed with a reason in the message.
# Rule: no method/hyperparameter/threshold decision may use test-split outcomes.
# Test splits are run once per frozen configuration and reported as-is.

status: FROZEN  # user confirmed go/no-go thresholds 2026-10-22
freeze_date: 2026-10-22

simulator:
  d: 5
  n_actions: 10
  n_windows: 12
  misspec: 0.5
  n_per_window: 5000
  n_anchor_default: 1000
  anchor_sweep: [0, 100, 1000, 10000]
  n_target_contexts: 10000
  n_mc_truth: 1000000

splits:
  dev:
    env_seeds: [0, 1, 2, 3]
    data_seeds: {start: 0, count: 50}        # per env seed
    regimes:                                  # intensities used for all tuning
      S0: [0.0]
      S1: [1.0]
      S2: [0.0]
      S3a: [0.5]
      S3b: [0.5]
      S4: [0.5]
  test:
    env_seeds: [100, 101, 102, 103]           # unseen environments
    data_seeds: {start: 10000, count: 75}     # per env seed -> 300 reps
    regimes:                                  # held-out intensities + held-out drift types
      S0: [0.0]
      S1: [0.5, 2.0]
      S2: [0.0]
      S3a: [0.25, 1.0]
      S3b: [0.25, 1.0]
      S4: [0.25, 1.0]
      S5: [0.5, 1.0]                          # drift type never seen in dev
      S6: [0.0]
      S7: [0.0]
  real:
    dataset: open_bandit  # semi-synthetic temporal interventions only; never claimed as natural drift

tuning:  # dev split only
  lambda_grid: [0.25, 0.5, 1.0, 2.0, 4.0]   # bias-penalty weight ("mse" selector ablation)
  z_group_grid: [2.0, 3.0, 4.0]             # window-homogeneity threshold ("segment" selector)
  z_anchor_grid: [1.5, 2.0, 2.5]            # anchor-veto threshold ("segment" selector)
  baseline_grids:
    recent_windows: [1, 2, 3, 4, 6, 8, 12]  # sliding-window DR (+ anchor)
    decay_gamma: [0.5, 0.7, 0.8, 0.9, 0.95] # exponential-decay DR
    liu_recent_windows: [1, 3, 6, 12]       # windows used to fit r_hat in regression-assisted DR
  selection_rule: >-
    For every method family (O-DRIFT included), pick the single hyperparameter
    setting minimizing the mean over dev cells of log RMSE (all candidate policies
    pooled). One setting per family is carried to the test split.
  candidate_policies: [0.0, 0.5, 1.0, 2.0]  # Policy.near_optimal noise levels (seed = env seed)
  delta_split: {variance: 0.025, bias: 0.025}  # union-bound allocation for 95% intervals

endpoints:
  primary: [rmse, policy_selection_regret]
  secondary: [coverage_95, coverage_90, mean_interval_width, abstention_rate, selective_coverage]
  stats: paired bootstrap over replications (10k resamples), 95% CI on RMSE differences

go_no_go:
  go_if_all:
    - O-DRIFT RMSE <= 0.90 x best tuned baseline in >= 2 of {S3a, S3b, S4, S5} test cells, paired 95% CI excluding 0
    - O-DRIFT RMSE <= 1.10 x best baseline in S0, S1, S2 (bounded regret when no reward drift)
    - coverage among non-abstained estimates >= 0.93 at nominal 0.95 in every test regime with an anchor
    - in S7, total weight on support-deficient windows <= 0.05 in >= 90% of replications
    - outputs 'not certified' (abstains) in 100% of replications with no anchor (n_anchor = 0)
  if_no_go: pivot to benchmark/failure-mode paper (proposal §16)
