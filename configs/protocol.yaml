# Experimental protocol. Frozen BEFORE any O-DRIFT tuning (see docs/PLAN.md).
# Any change after the freeze date must be committed with a reason in the message.
# Rule: no method/hyperparameter/threshold decision may use test-split outcomes.
# Test splits are run once per frozen configuration and reported as-is.

status: FROZEN  # user confirmed go/no-go thresholds 2026-10-22
freeze_date: 2026-10-22  # thresholds
method_freeze_date: 2026-10-24  # method, grids, baselines, regimes, tuned.json final (user confirmed)
method_freeze_commit_note: test split run once from this commit; tuned settings in results/tuned.json

simulator:
  d: 5
  n_actions: 10
  n_windows: 12
  misspec: 0.5
  n_per_window: 5000
  n_anchor_default: 1000
  anchor_sweep: [0, 100, 1000, 10000]
  anchor_sweep_cells: [S0@0.0, S1@2.0, S2@0.0, S3a@1.0, S3b@1.0, S4@1.0, S5@1.0, S8@1.0]  # fixed 2026-10-24
                     # before running 100/10000 (one cell per drift type, higher test intensity; frozen config)
  n_target_contexts: 10000
  n_mc_truth: 1000000

splits:
  dev:
    env_seeds: [0, 1, 2, 3]
    data_seeds: {start: 0, count: 50}        # per env seed
    regimes:                                  # intensities used for all tuning
      S0: [0.0]
      S1: [1.0]
      S2: [0.0]
      S3a: [0.5]
      S3b: [0.5]
      S4: [0.5]
  test:
    env_seeds: [100, 101, 102, 103]           # unseen environments
    data_seeds: {start: 10000, count: 75}     # per env seed -> 300 reps
    regimes:                                  # held-out intensities + held-out drift types
      S0: [0.0]
      S1: [0.5, 2.0]
      S2: [0.0]
      S3a: [0.25, 1.0]
      S3b: [0.25, 1.0]
      S4: [0.25, 1.0]
      S5: [0.5, 1.0]                          # drift type never seen in dev
      S6: [0.0]
      S7: [0.0]
      S8: [0.5, 1.0]                          # misspecified (out-of-class) reward drift; added 2026-10-23
                                              # before freeze; dev S8 runs are diagnostic only, never tuned on
      S8b: [1.0]                              # S8 without the in-class intercept: pure out-of-class drift,
                                              # stress test only (added 2026-10-24); dev S8b@0.5 diagnostic only, never tuned on
  real:
    dataset: open_bandit  # semi-synthetic temporal interventions only; never claimed as natural drift
    # Design fixed 2026-10-24, before any OBD result (decision log 23). Frozen config, NO tuning on OBD.
    source: Open Bandit Dataset (Saito et al. 2021, CC BY 4.0), random policy, Men campaign (452,949 rows, 34 items)
    real_parts: contexts and their real temporal order (7 days); base reward shape fit on real clicks
    synthetic_parts: actions (drawn from the regime's logger), propensities (exact), rewards, injected
      logger/reward drift. Natural context drift = whatever the real time order contains (not injected).
    contexts: one-hot user features 0-3 (31) + log1p(sum, max) user-item affinity -> standardize -> PCA d=8,
      each PC scaled to unit variance (fit on all rows)
    windows: rows sorted by timestamp, 13 equal-count blocks; blocks 0-11 = history, block 12 = target period
    base_reward: per-action logistic on [x, x^2] fit on real clicks (uniform logging -> unbiased);
      intercepts shifted by one constant so mean CTR = 0.05 (real CTR 0.005 makes per-window DR degenerate);
      the x^2 part makes the methods' linear reward model misspecified
    drift: reward/logger WindowSpecs from the simulator regimes (context_shift ignored); g, loggers drawn per env seed
    regimes: {S0: [0.0], S2: [0.0], S3a: [0.5, 1.0], S4: [0.5, 1.0], S5: [1.0]}
    env_seeds: [200, 201, 202, 203]
    data_seeds: {start: 20000, count: 50}  # per env seed: resampled contexts per block + actions + rewards
    sizes: {n_per_window: 5000, n_anchor: 1000, n_target_contexts: 10000}  # anchor/target disjoint, from block 12
    truth: exact average over ALL block-12 contexts of sum_a pi(a|x) q_T(x, a)
    candidate_policies: [0.0, 0.1, 0.2, 0.3]  # amendment 2026-10-24 before any OBD estimate was looked at
      # beyond a 4-episode smoke: simulator noise levels give ESS/n 0.007-0.02 at 34 actions (no overlap);
      # chosen so the noisiest policy's ESS/n (0.07) matches the simulator's noisiest (0.068); overlap-only rule
    report: same tables/breakdowns as test; descriptive only (no go/no-go)

  # ---------------- v2 (pre-registered 2026-10-27, user approved, BEFORE any v2 code or run; PLAN item 26)
  # v2 was designed after seeing v1 fail on OBD (PLAN 25). misspec_cells use EnvParams misspec = v2.misspec_high.
  dev2:
    env_seeds: [0, 1, 2, 3]
    data_seeds: {start: 0, count: 50}
    regimes: {S0: [0.0], S1: [1.0], S2: [0.0], S3a: [0.5], S3b: [0.5], S4: [0.5]}
    misspec_regimes: {S0: [0.0], S3a: [0.5], S4: [0.5]}
  test2:
    env_seeds: [500, 501, 502, 503]           # fresh, never used
    data_seeds: {start: 30000, count: 75}
    regimes: {S0: [0.0], S1: [0.5, 2.0], S2: [0.0], S3a: [0.25, 1.0], S3b: [0.25, 1.0], S4: [0.25, 1.0],
              S5: [0.5, 1.0], S6: [0.0], S7: [0.0], S8: [0.5, 1.0], S8b: [1.0]}
    misspec_regimes: {S0: [0.0], S2: [0.0], S3a: [1.0], S4: [1.0], S5: [1.0], S8: [1.0]}
  real2:  # same OBD design as splits.real (incl. amendments), fresh env/data seeds, never tuned on
    regimes: {S0: [0.0], S2: [0.0], S3a: [0.5, 1.0], S4: [0.5, 1.0], S5: [1.0]}
    env_seeds: [400, 401, 402, 403]
    data_seeds: {start: 40000, count: 50}
  test4:  # v4 one-shot simulator test; fresh, never used
    env_seeds: [600, 601, 602, 603]
    data_seeds: {start: 50000, count: 75}
    regimes: {S0: [0.0], S1: [0.5, 2.0], S2: [0.0], S3a: [0.25, 1.0], S3b: [0.25, 1.0], S4: [0.25, 1.0],
              S5: [0.5, 1.0], S6: [0.0], S7: [0.0], S8: [0.5, 1.0], S8b: [1.0]}
    misspec_regimes: {S0: [0.0], S2: [0.0], S3a: [1.0], S4: [1.0], S5: [1.0], S8: [1.0]}
  real4:  # v4 one-shot OBD test; same design as real2, fresh env/data seeds, never tuned on
    regimes: {S0: [0.0], S2: [0.0], S3a: [0.5, 1.0], S4: [0.5, 1.0], S5: [1.0]}
    env_seeds: [410, 411, 412, 413]
    data_seeds: {start: 45000, count: 50}
  real6:  # v6 one-shot REAL-reward Open Bandit test (src/odrift/obd_real.py); never run before freezing v6
    # env seed = 100 * campaign index (men 0, women 1, all 2) + target block; blocks are 19 equal-count time
    # blocks of the random log (~8.8 h each, 24-30 Nov 2019); history = the 12 preceding blocks
    env_seeds: [12, 13, 14, 15, 16, 17, 18, 112, 113, 114, 115, 116, 117, 118, 212, 213, 214, 215, 216, 217, 218]
    data_seeds: {start: 70000, count: 20}  # per task: subsamples of history windows, anchor, target contexts
    regimes: {REAL: [0.0]}

v2:
  misspec_high: 3.0   # nonlinear share of base-logit variance 0.43 (0.37-0.49 over dev envs) = OBD's 0.41;
                      # objective matching rule, no results used
  method: >-
    reference-validated reuse: balanced segment components as v1; instead of min-variance pooling,
    weights minimise the debiased MSE with each component's bias measured against the reference
    (reference segment + anchor, min-variance): d = V - r.V, Cov(d) = P S P^T (existing shrink_select).
    reuse_lam = 0 is exactly v1.
  amendment_a: >-
    2026-10-27, before any dev2 run (mechanism check on 3 dev episodes + unit tests only): shrink_select's
    unbiased bias^2 estimate d^2 - Var(d) is often negative and cancels a segment's own variance
    (weight moved TOWARD old segments as lam grew). Replaced by reference_validated_weights: reference
    and anchor treated as unbiased (b = 0), other segments b_i = sign(d_i) sqrt(max(d_i^2 - Var(d_i), 0)),
    Q = S + lam b b^T. Grid unchanged.
  fixed_from_v1: {monitor_alpha: 0.0001, z_anchor: 5.0, joint_segments: true}  # v1 tuned values, not re-tuned
  reuse_lam_grid: [0.0, 0.5, 1.0, 2.0, 4.0]
  not_changed: >-
    reward-model features (no x^2 - it is OBD's generating class); large-anchor reference check (PLAN 24)
  tuning: >-
    every family (baselines too) re-tuned on dev2 (all 9 cells) with tuning.selection_rule;
    written to results/tuned_v2.json (v1 results/tuned.json untouched)
  go_no_go_v2:
    - the five go_no_go criteria, unchanged, on test2 misspec-0.5 cells (S6/S7/no-anchor as in v1)
    - >-
      robustness, on reward-drift cells at misspec 3.0 (S3a, S4, S5, S8) and real2 (S3a x2, S4 x2, S5):
      no cell with RMSE ratio to the best tuned baseline > 1.5, and ratio <= 1.0 in >= half of them
  reporting: >-
    v1 test + v1 OBD reported as-is (motivation); v2 labelled post-hoc revision; real2 shares
    the real base reward with real (not fully independent); misspec-3 sim test is independent

v3:
  status: FROZEN  # user approved the v3 pre-registration 2026-10-28 ("lets continue the plan"); dev3 done
  opened: 2026-10-27  # user request: back the novelty claim (COPE, ICLR 2025) + one more dev round on S4#m3
  seeds: >-
    dev3 = dev2 seeds and cells; test3 / obd3 = test2 / real2 seeds and cells (never run under v2)
  basis: >-
    per episode, fit the pooled per-action reward model on a random half of the history (fold seed =
    data seed) with the linear and the rff32 basis; keep the lower held-out log-loss; the chosen basis
    is used by EVERY reward model of every method (the monitor keeps its quadratic model). Rule fixed
    from PLAN 29-30 before any dev3 run.
  cope_size_grid: [2, 4, 7, 13]  # COPE (Natsubori et al., ICLR 2025): target cluster size incl. the anchor;
                                 # cluster = windows with the closest mean reward (their heuristic); 13 = all
  grouping_kinds: [action, mean]  # ablation: O-DRIFT with a mechanism-blind segmentation statistic
                                  # (per-action raw rewards / overall raw reward), alpha tuned on the
                                  # monitor_alpha grid like the monitor was
  method_families: >-
    odrift v1 fixed from v1 (monitor 1e-4, z_anchor 5, joint); odrift2 reuse_lam grid as v2; every family
    re-tuned on dev3 with tuning.selection_rule -> results/tuned_v3.json
  offset_scale_grid: [1.0, 0.5, 0.25, 0.1]  # odrift3 family: v1 pipeline with segment-offset shrinkage
                                            # (multiplier scale s: L2 on offsets x 1/s^2); 1.0 = v1. Added after
                                            # the 48-episode dev prototype (PLAN 31); tuned on dev3 by the rule
  method_under_test: >-
    odrift3[tuned offset_scale] (v1 pipeline: monitor 1e-4, z_anchor 5, joint segments, min-variance
    pooling, DerSimonian-Laird interval; per-episode basis). v1 (s = 1) and odrift2 reported alongside.
  ablation_offset: >-
    the grouping ablation uses offset_scale 0.25 on dev3 (to tune its alpha) and the tuned odrift3
    offset_scale on test3
  dev3_tuned: >-
    results/tuned_v3.json (2026-10-28): odrift3 offset_scale 0.25; cope size 13; ablation grouping
    mean, alpha 1e-4. Baselines as written there.
  go_no_go_v3:  # approved + FROZEN 2026-10-28; written after dev3, before any test3/obd3 run
    - the five go_no_go criteria, unchanged, on test3 misspec-0.5 cells (S6/S7/no-anchor as in v1)
    - the go_no_go_v2 robustness criterion, unchanged, on test3 misspec-3.0 cells and obd3
    - >-
      novelty N1 (vs COPE, tuned): O-DRIFT RMSE < COPE with paired 95% CI excluding 0 in >= half of the
      test3 reward-drift cells (S3a, S3b, S4, S5, S8, S8b; every intensity, misspec 0.5 and 3.0), and <= 1.10 x COPE in S0, S1, S2
    - >-
      novelty N2 (mechanism awareness, grouping ablation): false-split rate (n_segments > 1) of the
      residual monitor <= 0.05 in every no-reward-drift cell (S0, S1, S2), misspec 0.5; the tuned
      blind grouping's rate reported next to it; the ablation's RMSE exceeds O-DRIFT's with paired CI
      excluding 0 in S1 or S2; and in no reward-drift cell is the ablation's RMSE <= 0.90 x O-DRIFT
      with CI excluding 0
  anchor_sweep_v3: >-
    POST-HOC, added 2026-10-29 at the user's request after the v3 test: the v1 anchor-sweep design
    (simulator.anchor_sweep_cells, n_anchor 100 and 10000; 0 and 1000 already run) applied to the frozen
    v3 configuration on the test3 seeds. Descriptive only (no criterion); reported as post-hoc.
  reporting_v3: >-
    v1 and v2 dev results reported as development history; misspec-3 false splits (Claim-1 caveat)
    reported per cell; N1/N2 reported in full even if they fail

tuning:  # dev split only
  lambda_grid: [0.25, 0.5, 1.0, 2.0, 4.0]   # bias-penalty weight ("mse" selector ablation)
  z_group_grid: [2.0, 3.0, 4.0]             # window-homogeneity threshold ("segment" selector)
  z_anchor_grid: [1.5, 2.0, 2.5]            # anchor-veto threshold ("segment" selector)
  baseline_grids:
    recent_windows: [1, 2, 3, 4, 6, 8, 12]  # sliding-window DR (+ anchor)
    decay_gamma: [0.5, 0.7, 0.8, 0.9, 0.95] # exponential-decay DR
    liu_recent_windows: [1, 3, 6, 12]       # windows used to fit r_hat in regression-assisted DR
    # Strong-baseline suite (added 2026-10-23, before any run of these baselines):
    slope_kappa: [1.0, 2.0, 3.0]            # SLOPE (Su et al. 2020) interval multiplier
    magic_z_ref: [0.67, 1.0, 1.96]          # MAGIC (Thomas & Brunskill 2016) reference-CI z
    transport_recent: [1, 2, 3, 4, 6, 8, 12]  # transport DR on newest k windows + anchor
    transport_decay: [0.5, 0.7, 0.8, 0.9, 0.95]  # transport DR, weights ~ gamma^(K-k)/var_k
    # Drift-specific baselines (added 2026-10-23, before any run of these baselines):
    forecast_degree: [1, 2, 3]              # Chandak et al. 2020: GLS polynomial forecast of per-window values
    time_dr_degree: [1, 2]                  # pooled DR, reward model with polynomial time interactions
    transport_balanced_decay: [0.7, 0.8, 0.9, 0.95, 1.0]  # composite transport + balanced + decay
    # untuned: anchor-validated selection, multi-logger balanced DR, monitor-informed selection.
    # recent/decay full grids are also run on test, ONLY to report per-cell oracle-tuned
    # upper bounds (labelled as such); comparisons use the dev-tuned settings.
  selection_rule: >-
    For every method family (O-DRIFT included), pick the single hyperparameter
    setting minimizing the mean over dev cells of log RMSE (all candidate policies
    pooled). One setting per family is carried to the test split.
  candidate_policies: [0.0, 0.5, 1.0, 2.0]  # Policy.near_optimal noise levels (seed = env seed)
  # Final O-DRIFT pipeline (dev decision log items 9-12): reward monitor -> per-segment reward
  # models -> anchor-checked reference segment -> drift-corrected reuse -> min-variance pooling.
  odrift_fixed: {fallback: least, context_alpha: 0.01, z_group: 3.5}
  odrift_grid:                              # tuned on dev with the family-wise rule above
    monitor_alpha: [0.01, 0.001, 0.0001]
    z_anchor: [3.0, 3.5, 4.0, 5.0]
    joint_segments: [false, true]           # added 2026-10-23 (decision log 16): segment reward models fit
                                            # separately vs jointly (shared base + per-segment offsets)
  delta_split: {variance: 0.025, bias: 0.025}  # union-bound allocation for 95% intervals

endpoints:
  primary: [rmse, policy_selection_regret]
  secondary: [coverage_95, coverage_90, mean_interval_width, abstention_rate, selective_coverage]
  stats: paired bootstrap over replications (10k resamples), 95% CI on RMSE differences
  # pre-registered 2026-10-23 (before any test run):
  breakdowns: per-env-seed and per-candidate-policy RMSE ratio vs best tuned baseline, bias/sd split,
    reported for every cell (no cell-level cherry-picking); S8 reported as robustness, not a go/no-go cell
  fairness: report the number of dev settings searched per method family (O-DRIFT 12; baselines 3-7)

go_no_go:
  go_if_all:
    - O-DRIFT RMSE <= 0.90 x best tuned baseline in >= 2 of {S3a, S3b, S4, S5} test cells, paired 95% CI excluding 0
    - O-DRIFT RMSE <= 1.10 x best baseline in S0, S1, S2 (bounded regret when no reward drift)
    - coverage among non-abstained estimates >= 0.93 at nominal 0.95 in every test regime with an anchor
    - in S7, total weight on support-deficient windows <= 0.05 in >= 90% of replications
    - outputs 'not certified' (abstains) in 100% of replications with no anchor (n_anchor = 0)
  if_no_go: pivot to benchmark/failure-mode paper (proposal §16)

v4:
  status: DEV  # set FROZEN only after the user approves the v4 test pre-registration
  opened: 2026-10-28  # user chose revision (b) after the v3 OBD robustness failure (PLAN 33);
                      # user decision: tune on the simulator only, OBD is never tuned on
  post_hoc: >-
    v4 is motivated by v3 test results (OBD3) and must be reported as a post-hoc revision. v3 test3/obd3
    results are reported as they are. test2/real2 seeds are spent; v4 tests use fresh seeds (test4, real4).
    No OBD episode is run for v4 development.
  method: >-
    odrift4 = v1 pipeline (monitor 1e-4, z_anchor 5, joint segments, offset_scale 1.0, per-episode basis
    rule of v3, min-variance pooling, DerSimonian-Laird interval) + gated reuse: a drift-corrected
    non-reference segment is pooled only if |V_seg - V_ref| <= z_gate * se(V_seg - V_ref), V_ref = reference
    segment + anchor at minimum variance (method.gate_components); otherwise it gets weight 0.
  z_gate: 1.96  # FIXED a priori (two-sided 5% per segment), NOT tuned: every reuse knob tuned on simulated
                # drift so far moved toward more reuse and failed on OBD (v1, v3). dev4 reports z_gate in
                # {1.0, 1.96, 3.0} for information only.
  offset_scale: 1.0  # v3 shrinkage dropped (post-hoc: it under-corrected OBD3's larger drift)
  splits: >-
    dev4 = dev2/dev3 seeds and cells (baselines re-tuned there by tuning.selection_rule, as in v3);
    test4 = splits.test4; obd4 = splits.real4
  ablation: grouping ablation = odrift4 with the blind statistic (kinds and alpha grid as v3, alpha tuned on dev4)
  go_no_go_v4: >-
    to be written after dev4 and before any test4/obd4 run; proposed: the v3 list unchanged (five core
    criteria, go_no_go_v2 robustness on misspec-3 + obd4, N1, N2), method under test odrift4[1.96]

v5:
  status: DEV  # set FROZEN only after the user approves the v5 test pre-registration
  opened: 2026-10-29  # user asked for another revision (b) after v4 failed dev (PLAN 34); sim-only tuning kept
  post_hoc: >-
    motivated by v3 test (OBD3) and v4 dev results; report as a post-hoc revision. v4 never reached test, so
    test4/real4 seeds are still unused and serve as v5's test seeds (test5 = splits.test4, obd5 = splits.real4).
    No OBD episode is run for v5 development.
  method: >-
    odrift5 = per-episode rolling-origin back-test (src/odrift/backtest.py). For origins o = K-1, K-2 the
    history window o is split into a pseudo-anchor (anchor size) and a validation part; three candidates run on
    windows < o and are scored by squared error against the validation part's DR value, averaged over origins
    and candidate policies. The lowest wins and is used for the real target:
    reuse = v1 (monitor 1e-4, z_anchor 5, joint, offset_scale 1); shrink = v1 with offset_scale 0.25;
    reference = newest monitor segment + anchor, DR, no reuse (monitor_select_dr).
  fixed_a_priori: {origins: 2, candidates: [reuse, shrink, reference]}  # nothing tuned
  shrink: 0.25  # the v3 dev-tuned value, fixed
  basis: per-episode rule of v3
  ablation: grouping ablation as v3 (odrift3 config) for N2
  go_no_go_v5: >-
    to be written after dev5 and before any test5/obd5 run; proposed: the v3 list unchanged (five core
    criteria, go_no_go_v2 robustness on misspec-3 + obd5, N1, N2), method under test odrift5

v6:
  status: FROZEN  # 2026-10-29, before any test6/real6 result; under the user instruction "do everything make a strong paper"; smoke runs only on dev seeds (dev6) and on one real task with errors suppressed
  opened: 2026-10-29  # user: "do everything make a strong paper"; reviewers of the user's earlier papers
                      # criticised simple baselines, so v6 adds a faithful recent baseline and real rewards
  purpose: >-
    replication, not a revision: the method under test is the FROZEN v3 configuration, unchanged
    (odrift3[0.25] with every v3 setting and results/tuned_v3.json). v6 adds (i) OPFV as a baseline,
    (ii) a second one-shot simulator test on fresh seeds (test6 = splits.test4, never run), and (iii) a
    one-shot evaluation on real rewards and naturally occurring drift (real6). v4/v5 are not involved.
  opfv: >-
    OPFV (Shimizu et al., KDD 2025, Eq. 4): records whose time feature equals the target's are importance
    weighted (weight 1/p(phi(T))), plus a time-aware reward regression evaluated at the target time on the
    target contexts (baselines.opfv). Time feature chosen per episode by their Eq. 7 (squared bias against
    the finest feature + variance) from a fixed candidate set: recency {0, 1, 2, 3, 6, 12} windows and
    periods {2, 3, 4, 6} windows (6 = the simulator's seasonal period, i.e. the right calendar feature is
    available to OPFV). Regressor = baselines.fit_time_reward.
  opfv_degree: 1  # FIXED a priori = the dev3-tuned degree of the time-aware DR baseline (same regressor);
                  # nothing else in OPFV is tuned, so no dev run is needed (dev6 is a code smoke test only)
  tuned: "results/tuned_v6.json = results/tuned_v3.json plus opfv 1"
  real6_design: >-
    Open Bandit, all three campaigns, uniform-random log (contexts, items, clicks real; propensity 1/n_items).
    Task (campaign, target block b), b = 12..18: history = blocks b-12..b-1, each subsampled to n_per_window
    = 5000; anchor = 1000 and target contexts = 10000 disjoint random rows of block b. Evaluation policy
    pi_b(a | position) = BTS's item frequencies per position in block b's time span (BTS log, same A/B
    test); ground truth = BTS's on-policy click rate in that span (~0.2-0.7 million impressions per block,
    se <= 0.2e-3). Oracle uses BTS click rates of the history blocks as V_{T<-k} (approximate). Basis rule
    of v3. 21 tasks x 20 data seeds = 420 episodes. Caveats stated in the paper: BTS shows slates, so
    position effects of the other items are ignored (as in Saito et al. 2021); one evaluation policy per task.
  go_no_go_v6:  # written 2026-10-29 before any v6 result
    - >-
      test6 (simulator, misspec 0.5 cells): the five core criteria C1-C5 unchanged, with OPFV added to the
      baselines that "best tuned baseline" ranges over
    - test6 misspec-3.0 cells: the go_no_go_v2 robustness criterion (R1, R2) unchanged; no OBD semi-synthetic run in v6
    - test6: N1 (vs COPE) and N2 (grouping ablation) unchanged
    - >-
      N3 (vs OPFV): O-DRIFT RMSE < OPFV with paired 95% CI excluding 0 in >= half of the test6 reward-drift
      cells (S3a, S3b, S4, S5, S8, S8b; every intensity, misspec 0.5 and 3.0), and <= 1.10 x OPFV in S0, S1, S2
    - >-
      E1 (real rewards, real6): O-DRIFT RMSE over all 420 episodes <= 1.10 x the best tuned baseline;
      paired bootstrap over the 21 tasks (cluster resampling). E2: same per campaign, reported. E3: interval
      coverage reported against the BTS truth (no threshold: truth itself has se up to 0.2e-3).
  expectation_real6: >-
    written before any real6 result: with click rates of 0.3-0.7% and 5000 records per window, reward drift
    between 8.8-hour blocks is probably below the monitor's detection threshold; we expect few splits and
    O-DRIFT close to pooled / balanced DR. Reported whatever happens.
  reporting_v6: >-
    every criterion reported in full even if it fails; test3 results remain the primary simulator result,
    test6 is reported as a replication; real6 RMSE also given as a noise-corrected value
    sqrt(max(MSE - mean truth variance, 0)).

